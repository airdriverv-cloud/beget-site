<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Уроки цигун</title>
<style>
:root{--ink:#1c1915;--muted:#6a6158;--paper:#f3eee6;--card:#fffdf9;--line:#e3d7c7}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif;line-height:1.55}
header,main,footer{width:min(920px,calc(100% - 28px));margin:0 auto}
nav{padding:20px 0;font-family:system-ui,sans-serif;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(36px,6vw,60px);line-height:.95;font-weight:500;margin:8px 0 12px}
.lead{color:var(--muted);font-size:18px}
figure{margin:18px 0;background:var(--card);border:1px solid var(--line);padding:12px}
img{width:100%;height:auto;display:block}
figcaption{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted);margin-top:8px}
.lesson{background:var(--card);border:1px solid var(--line);padding:18px}ol{padding-left:20px}
footer{padding:8px 0 32px;color:var(--muted);font-family:system-ui,sans-serif;font-size:13px}
</style>
</head>
<body>
<header>
<nav>Уроки цигун</nav>
<h1>Стойка с фото.</h1>
<p class="lead">Тестовая сборка: фото подключено по прямой ссылке, файл в репозиторий не копировался.</p>
<figure>
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/Dancer_in_the_park_(6217801980).jpg" alt="Женщина с веером в парке">
<figcaption>Фото: Dancer in the park, Wikimedia Commons. Лицензия — на <a href="https://commons.wikimedia.org/wiki/File:Dancer_in_the_park_(6217801980).jpg">странице файла</a>.</figcaption>
</figure>
</header>
<main>
<section class="lesson"><h2>Как стоять</h2><ol><li>Стопы на ширине плеч, колени чуть согнуты.</li><li>Руки мягкие, плечи внизу.</li><li>Дыхание носом, без боли.</li></ol></section>
</main>
<footer>Учебная страница. Не медицинская рекомендация.</footer>
</body>
</html>
